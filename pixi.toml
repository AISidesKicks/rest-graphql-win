[workspace]
authors = ["AISidesKicks <198066858+AISidesKicks@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "apis"
platforms = ["linux-64"]
version = "0.1.0"

[activation]

[activation.env]
TMPDIR = "/run/user/$UID/pixi_tmp/$PIXI_PROJECT_NAME"
SCRATCH = "$PIXI_PROJECT_ROOT/scratch"
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"

[dependencies]
python = "==3.12"
fastapi = ">=0.149.0,<0.150"
uvicorn = ">=0.54.0,<0.55"
pydantic = ">=2.14.1,<3"
httpx = ">=0.28.1,<0.29"
duckdb = ">=1.5.6,<2"
pytest = ">=9.1.1,<10"
ruff = ">=0.17.1,<0.18"
opentelemetry-api = ">=1.45.1,<2"
opentelemetry-sdk = ">=1.45.1,<2"
opentelemetry-exporter-otlp-proto-grpc = ">=1.45.1,<2"
cryptography = ">=50.0.2,<51"

[pypi-dependencies]
strawberry-graphql = ">=0.336.0, <0.337"
mcp = ">=2.3.0, <3"
pydantic-monty = ">=1.2.0, <2"
tiktoken = ">=0.14.0, <0.15"

[tasks]
seed = "python scripts/seed.py"
etl = "python scripts/etl.py"
serve = "python scripts/serve.py"
bench = "python scripts/bench.py"
tools = "python scripts/dump_tools.py"
savings = "python scripts/savings.py"
verify = "python scripts/verify.py"
test = "pytest -q"
lint = "ruff check src scripts tests"
format = "ruff format src scripts tests"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
